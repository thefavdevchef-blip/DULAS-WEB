<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DUMPLING LASAGNA - $DULAS</title>
    <style>
        :root {
            --lasagna-red: #b22222;
            --accent-gold: #daa520;
        }
        
        body {
            /* FOTO BACKGROUND LANDSCAPE ANDA */
            background-image: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('IMG-20260301-WA0001.jpg');
            background-attachment: fixed;
            background-size: cover;
            background-position: center;
            color: #ffffff;
            font-family: 'Arial Black', sans-serif;
            text-align: center;
            margin: 0;
            padding-bottom: 50px;
        }

        header {
            padding: 40px 20px;
            background: rgba(178, 34, 34, 0.9);
            border-bottom: 6px solid var(--accent-gold);
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        }

        h1 { font-size: 2.2rem; margin: 0; letter-spacing: 1px; }
        
        /* LOGO DULAS BERGERAK (VIDEO) */
        .video-logo {
            margin: 30px auto;
            width: 80%;
            max-width: 400px;
            border: 6px solid white;
            border-radius: 50%; /* Membuat video jadi bulat seperti logo */
            box-shadow: 0 0 30px rgba(255,255,255,0.3);
            overflow: hidden;
            aspect-ratio: 1/1; /* Memastikan tetap bulat sempurna */
        }

        video { width: 100%; height: 100%; object-fit: cover; }

        .presale-info {
            background: var(--accent-gold);
            color: #3e2723;
            padding: 15px;
            font-weight: bold;
            margin: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding: 0 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px); /* Efek kaca transparan */
            padding: 15px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.3);
            text-align: left;
        }

        .card span { color: var(--accent-gold); font-weight: bold; display: block; font-size: 1rem; }

        .btn-group { padding: 20px; }
        
        .btn {
            display: block;
            padding: 18px;
            margin: 12px 0;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1rem;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .btn-tele { background: #0088cc; color: white; }
        .btn-x { background: #000; color: white; border: 1px solid #444; }
        
        .burn-banner {
            background: var(--lasagna-red);
            padding: 10px;
            font-weight: bold;
            margin-top: 20px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<header>
    <h1>DUMPLING LASAGNA</h1>
    <div style="color: var(--accent-gold);">$DULAS 🥟🍝</div>
</header>

<div class="video-logo">
    <video autoplay muted loop playsinline>
        <source src="grok_video_2026-02-15-02-25-33.mp4" type="video/mp4">
    </video>
</div>

<div class="presale-info">
    🚀 PRESALE: MARCH 7, 2026 - 15:00 UTC
</div>

<div class="stats-grid">
    <div class="card">Hard Cap: <span>105 SOL</span></div>
    <div class="card">Soft Cap: <span>53 SOL</span></div>
    <div class="card">Rate: <span>1 SOL = 47.6M</span></div>
    <div class="card">Airdrop: <span>500M (5%)</span></div>
</div>

<div class="burn-banner">🔥 100% UNSOLD TOKENS BURNED 🔥</div>

<div class="btn-group">
    <a href="https://t.me/DumplingLasagna" class="btn btn-tele">JOIN TELEGRAM</a>
    <a href="https://x.com/dumplinglasag" class="btn btn-x">FOLLOW ON X (TWITTER)</a>
</div>

</body>
</html>
