<div class="countdown-container">
        <div style="font-size: 9px; margin-bottom: 15px;">PRESALE STARTS IN:</div>
        <div id="timer">
            <div class="timer-unit"><div id="days">00</div><span>DAYS</span></div>
            <div class="timer-unit"><div id="hours">00</div><span>HRS</span></div>
            <div class="timer-unit"><div id="minutes">00</div><span>MINS</span></div>
            <div class="timer-unit"><div id="seconds">00</div><span>SECS</span></div>
        </div>
        
        <a href="https://solsale.app/presale/E5ahxQ9WbsiJtAbpidQxERxBBmWbA8RcCMdDhHtcs6cg" 
           target="_blank" 
           style="display: inline-block; margin-top: 25px; padding: 15px 30px; background: #27ae60; color: white; text-decoration: none; border: 3px solid #fff; font-size: 14px;">
           BUY $DULAS NOW 🥟
        </a>
    </div>

    <div style="max-width: 550px; margin: 20px auto; padding: 0 20px;">
        <div style="font-size: 8px; text-align: left; margin-bottom: 8px;">PROGRESS: <span id="sol-raised">0</span> / 105 SOL</div>
        <div style="width: 100%; height: 25px; background: #333; border: 3px solid var(--accent-gold); position: relative;">
            <div id="progress-fill" style="width: 0%; height: 100%; background: var(--accent-gold);"></div>
        </div>
        <div style="font-size: 7px; margin-top: 8px; color: #ccc;">*Data refreshes on GemPad page</div>
    </div>

<script>
    function enterSite() {
        document.getElementById('gatekeeper').style.display = 'none';
        document.getElementById('website-content').style.display = 'block';
        
        // --- UPDATE TARGET TIME KE JAM 7 PAGI BESOK ---
        // 23:00 UTC = Jam 07:00 WITA
        const countDate = new Date("March 15, 2026 23:00:00 UTC").getTime();
        
        setInterval(() => {
            const now = new Date().getTime();
            const gap = countDate - now;
            const second = 1000; const minute = second * 60; const hour = minute * 60; const day = hour * 24;
            
            if (gap > 0) {
                document.getElementById("days").innerText = Math.floor(gap / day).toString().padStart(2, '0');
                document.getElementById("hours").innerText = Math.floor((gap % day) / hour).toString().padStart(2, '0');
                document.getElementById("minutes").innerText = Math.floor((gap % hour) / minute).toString().padStart(2, '0');
                document.getElementById("seconds").innerText = Math.floor((gap % minute) / second).toString().padStart(2, '0');
            } else {
                document.getElementById("timer").innerHTML = "<div style='width:100%; color:#27ae60;'>PRESALE IS LIVE!</div>";
                // Jika sudah LIVE, progress bar bisa kita geser sedikit buat narik psikologi pembeli
                document.getElementById("progress-fill").style.width = "2%"; 
                document.getElementById("sol-raised").innerText = "2.1";
            }
        }, 1000);
    }
</script>
